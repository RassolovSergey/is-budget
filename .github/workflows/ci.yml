name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - name: Run backend tests
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  analytics:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/analytics
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install analytics dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile analytics modules
        run: python -m compileall app scripts tests
      - name: Run analytics tests
        run: python -m unittest discover -s tests -t . -p 'test_*.py'

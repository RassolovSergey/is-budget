  /api/projects/{projectId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
    get:
      tags: [Dashboard]
      summary: Get dashboard aggregates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/forecast:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [Forecast]
      summary: Create forecast run
      description: |
        Backend orchestration role:
        - собирает фактическую историю доходов проекта;
        - добавляет агрегированный ad spend;
        - подмешивает historical campaigns той же категории;
        - вызывает analytics service;
        - нормализует и сохраняет результат.

        Семантика сценариев:
        - `p10` — pessimistic scenario,
        - `yhat` — expected scenario,
        - `p90` — optimistic scenario.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastRunRequest'
      responses:
        '201':
          description: Forecast run created
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: Analytics integration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serviceUnavailable:
                  value:
                    error: forecast service unavailable
                    code: forecast_service_unavailable
                invalidResponse:
                  value:
                    error: forecast service returned invalid response
                    code: forecast_service_invalid_response
        '504':
          description: Forecast service timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeout:
                  value:
                    error: forecast service timeout
                    code: forecast_service_timeout
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/forecast/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Forecast]
      summary: List forecast runs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Forecast run list
  /api/projects/{projectId}/forecast/latest:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Forecast]
      summary: Get latest forecast run
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest forecast run
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/forecast/{runId}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RunID'
    get:
      tags: [Forecast]
      summary: Get forecast run by id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Forecast run
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Forecast]
      summary: Delete forecast run
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Forecast run deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/forecast/{runId}/report.pdf:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RunID'
    get:
      tags: [Forecast]
      summary: Download forecast report PDF
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Forecast report PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/historical-campaigns:
    get:
      tags: [Historical Campaigns]
      summary: List historical campaigns for current user
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: Historical campaigns list
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Historical Campaigns]
      summary: Create historical campaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalCampaignUpsertRequest'
      responses:
        '201':
          description: Historical campaign created
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/historical-campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/CampaignID'
    put:
      tags: [Historical Campaigns]
      summary: Update historical campaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalCampaignUpsertRequest'
      responses:
        '200':
          description: Historical campaign updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Historical Campaigns]
      summary: Delete historical campaign
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Historical campaign deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectID:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntityID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignID:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until next retry window
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                error: too many requests, please try again later
                code: rate_limited
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Stable machine-readable error code
        details:
          type: object
          additionalProperties:
            type: string
          description: Field-level validation details
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, nickname]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        first_name:
          type: string
          minLength: 1
          maxLength: 80
        last_name:
          type: string
          minLength: 1
          maxLength: 80
        nickname:
          type: string
          minLength: 3
          maxLength: 32
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    UpdatePreferencesRequest:
      type: object
      required: [default_currency_code]
      properties:
        default_currency_code:
          type: string
          enum: [EUR, USD, RUB]
    UpdateProfileRequest:
      type: object
      required: [first_name, last_name, nickname, default_currency_code]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 80
        last_name:
          type: string
          minLength: 1
          maxLength: 80
        nickname:
          type: string
          minLength: 3
          maxLength: 32
        default_currency_code:
          type: string
          enum: [EUR, USD, RUB]
    UpdateEmailRequest:
      type: object
      required: [new_email, current_password]
      properties:
        new_email:
          type: string
          format: email
        current_password:
          type: string
          minLength: 6
    UpdatePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 6
        new_password:
          type: string
          minLength: 6
    ProjectRequest:
      type: object
      required: [name, duration_days]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        duration_days:
          type: integer
          minimum: 3
          maximum: 30
        currency_code:
          type: string
          enum: [EUR, USD, RUB]
        secondary_currency_code:
          type: string
          enum: [EUR, USD, RUB]
        category:
          type: string
          minLength: 2
          maxLength: 80
    CategoryFolderSummary:
      type: object
      required: [category, active_projects_count, completed_projects_count, historical_campaigns_count]
      properties:
        category:
          type: string
        active_projects_count:
          type: integer
          minimum: 0
        completed_projects_count:
          type: integer
          minimum: 0
        historical_campaigns_count:
          type: integer
          minimum: 0
    AddMemberRequest:
      type: object
      required: [role]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
          minLength: 3
          maxLength: 32
        role:
          type: string
          description: One of current backend role labels, for example TEAM / ANALYST / CUSTOMER.
    PlannedExpenseRequest:
      type: object
      required: [category, amount, due_date]
      properties:
        category:
          type: string
          minLength: 2
          maxLength: 60
        amount:
          type: number
          minimum: 0
        due_date:
          type: string
          format: date
        is_mandatory:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        note:
          type: string
          maxLength: 500
    IncomeUpsertRequest:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
          description: |
            Stored as daily delta. Negative values are allowed for returns/refunds.
    IncomeCumulativeRequest:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          items:
            type: object
            required: [date]
            properties:
              date:
                type: string
                format: date
              cumulative_amount:
                type: number
                nullable: true
                minimum: 0
    ActualExpenseRequest:
      type: object
      required: [title, category, amount, paid_at]
      properties:
        planned_expense_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 2
          maxLength: 120
        category:
          type: string
          minLength: 2
          maxLength: 60
        amount:
          type: number
          minimum: 0
        paid_at:
          type: string
          format: date
        note:
          type: string
          maxLength: 500
    TaxRuleRequest:
      type: object
      required: [name, percent, level]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        percent:
          type: number
          minimum: 0
          maximum: 100
        level:
          type: integer
          minimum: 1
        prepend_before_first:
          type: boolean
    TaxRulesReorderRequest:
      type: object
      required: [ordered_ids]
      properties:
        ordered_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    ProfitShareRuleRequest:
      type: object
      required: [recipient_name, responsibility, percent, level]
      properties:
        recipient_user_id:
          type: string
          format: uuid
        recipient_name:
          type: string
          minLength: 2
          maxLength: 120
        responsibility:
          type: string
          minLength: 2
          maxLength: 160
        currency_code:
          type: string
          enum: [EUR, USD, RUB]
        percent:
          type: number
          minimum: 0
          maximum: 100
        level:
          type: integer
          minimum: 1
          maximum: 20
        applies_after_mandatory:
          type: boolean
        prepend_before_first:
          type: boolean
    ForecastRunRequest:
      type: object
      required: [horizon_days]
      properties:
        horizon_days:
          type: integer
          minimum: 1
          maximum: 30
    HistoricalCampaignUpsertRequest:
      type: object
      required: [name, category, duration_days, currency_code, days]
      properties:
        name:
          type: string
        category:
          type: string
        duration_days:
          type: integer
        currency_code:
          type: string
          enum: [EUR, USD, RUB]
        started_at:
          type: string
          format: date
        ended_at:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/HistoricalCampaignDayRequest'
    HistoricalCampaignDayRequest:
      type: object
      required: [day_number, income_amount]
      properties:
        day_number:
          type: integer
        income_amount:
          type: number
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/HistoricalCampaignExpenseRequest'
    HistoricalCampaignExpenseRequest:
      type: object
      required: [category, amount]
      properties:
        category:
          type: string
        amount:
          type: number
    MyIncomeItem:
      type: object
      required: [rule_id, recipient_name, responsibility, level, percent, project_amount, project_currency_code, user_amount, user_currency_code, conversion_rate_to_user]
      properties:
        rule_id:
          type: string
          format: uuid
        recipient_name:
          type: string
        responsibility:
          type: string
        level:
          type: integer
        percent:
          type: number
        project_amount:
          type: number
        project_currency_code:
          type: string
          enum: [EUR, USD, RUB]
        user_amount:
          type: number
        user_currency_code:
          type: string
          enum: [EUR, USD, RUB]
        conversion_rate_to_user:
          type: number
    MyIncomeForecastScenario:
      type: object
      required: [projected_income_total, project_amount, user_amount]
      properties:
        projected_income_total:
          type: number
        project_amount:
          type: number
        user_amount:
          type: number
    MyIncomeForecastProjection:
      type: object
      required: [run_id, created_at, p10, yhat, p90]
      properties:
        run_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        p10:
          $ref: '#/components/schemas/MyIncomeForecastScenario'
        yhat:
          $ref: '#/components/schemas/MyIncomeForecastScenario'
        p90:
          $ref: '#/components/schemas/MyIncomeForecastScenario'
    MyIncomeResponse:
      type: object
      required: [project_id, project_currency_code, user_currency_code, income_total, expenses_total, net_profit_to_date, tax_total, available_for_sharing, distributed_amount, distributed_to_others, total_project_amount, total_user_amount, total_conversion_rate, matching_strategy, items]
      properties:
        project_id:
          type: string
          format: uuid
        project_currency_code:
          type: string
          enum: [EUR, USD, RUB]
        user_currency_code:
          type: string
          enum: [EUR, USD, RUB]
        income_total:
          type: number
        expenses_total:
          type: number
        net_profit_to_date:
          type: number
        tax_total:
          type: number
        available_for_sharing:
          type: number
        distributed_amount:
          type: number
        distributed_to_others:
          type: number
        total_project_amount:
          type: number
        total_user_amount:
          type: number
        total_conversion_rate:
          type: number
        matching_strategy:
          type: string
        forecast_projection:
          allOf:
            - $ref: '#/components/schemas/MyIncomeForecastProjection'
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyIncomeItem'

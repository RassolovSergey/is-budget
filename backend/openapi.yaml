openapi: 3.0.3
info:
  title: IS Budget Backend API
  version: 1.2.0
  description: |
    Backend API для управления проектами, финансами, выплатами и запуском прогнозов.

    Важно:
    - спецификация отражает текущую фактическую реализацию;
    - ошибки возвращаются в едином формате `error / code / details`;
    - часть чувствительных маршрутов защищена мягким in-memory rate limiting.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Регистрация, вход, профиль пользователя и настройки аккаунта.
  - name: Projects
    description: Управление проектами и базовыми атрибутами проекта.
  - name: Project Members
    description: Участники проекта, роли доступа и приглашения.
  - name: Planned Expenses
    description: Плановые расходы проекта.
  - name: Income Daily
    description: Доходы проекта по дням, включая cumulative-input API.
  - name: Actual Expenses
    description: Фактические расходы проекта.
  - name: Tax Rules
    description: Налоги и комиссии, удерживаемые до распределения прибыли.
  - name: Profit Share Rules
    description: Ручные правила распределения прибыли.
  - name: Payouts
    description: Предпросмотр, расчёт и экспорт выплат.
  - name: Dashboard
    description: Агрегированные показатели проекта.
  - name: Forecast
    description: Запуски прогнозирования и результаты.
  - name: Historical Campaigns
    description: Исторические кампании пользователя для калибровки прогноза.
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register user
      description: |
        Создаёт пользователя и сразу возвращает access token.
        Маршрут защищён мягким rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration success
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Выполняет вход по email и паролю, возвращает access token.
        Маршрут защищён мягким rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/preferences:
    put:
      tags: [Auth]
      summary: Update user preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Preferences updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/profile:
    put:
      tags: [Auth]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/email:
    put:
      tags: [Auth]
      summary: Update email
      description: Маршрут защищён мягким rate limiting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailRequest'
      responses:
        '200':
          description: Email updated, new access token issued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password:
    put:
      tags: [Auth]
      summary: Update password
      description: Маршрут защищён мягким rate limiting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/avatar:
    post:
      tags: [Auth]
      summary: Upload avatar
      description: |
        Принимает multipart upload. Backend проверяет:
        - размер файла;
        - допустимое расширение;
        - MIME/content соответствие допустимым image-форматам.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Auth]
      summary: Delete current avatar
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avatar removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/avatar/{fileName}:
    get:
      tags: [Auth]
      summary: Download avatar file
      parameters:
        - name: fileName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Avatar file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      summary: Create project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/category-folders:
    get:
      tags: [Projects]
      summary: List category folder summaries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category folder summary list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryFolderSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Projects]
      summary: Get project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project with current user role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Projects]
      summary: Update project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Projects]
      summary: Delete project
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/activate:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [Projects]
      summary: Activate project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project activated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/leave:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [Projects]
      summary: Leave project
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Left project
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Project Members]
      summary: List project members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Members list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Project Members]
      summary: Add member by user_id, email or nickname
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Invite created for target user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Project Members]
      summary: Delete member
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Member removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/invites:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Project Members]
      summary: List project invites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invite list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Project Members]
      summary: Revoke pending invite
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Invite revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/project-invites/incoming:
    get:
      tags: [Project Members]
      summary: List incoming invites for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Incoming invites
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/project-invites/{token}/accept:
    post:
      tags: [Project Members]
      summary: Accept invite
      description: Маршрут защищён мягким rate limiting.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/project-invites/{token}/decline:
    post:
      tags: [Project Members]
      summary: Decline invite
      description: Маршрут защищён мягким rate limiting.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Invite declined
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/planned-expenses:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Planned Expenses]
      summary: List planned expenses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Planned expenses
    post:
      tags: [Planned Expenses]
      summary: Create planned expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannedExpenseRequest'
      responses:
        '201':
          description: Planned expense created
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/planned-expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/EntityID'
    put:
      tags: [Planned Expenses]
      summary: Update planned expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannedExpenseRequest'
      responses:
        '200':
          description: Planned expense updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Planned Expenses]
      summary: Delete planned expense
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Planned expense deleted
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/income-daily:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
    get:
      tags: [Income Daily]
      summary: List daily income
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daily income records
    post:
      tags: [Income Daily]
      summary: Upsert income by date
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeUpsertRequest'
      responses:
        '200':
          description: Income record upserted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/income-daily/cumulative:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    put:
      tags: [Income Daily]
      summary: Upsert cumulative income series
      description: |
        UI-level cumulative input. Backend пересчитывает series в дневные delta values.
        Поддерживает очистку точки через `cumulative_amount: null`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeCumulativeRequest'
      responses:
        '200':
          description: Cumulative series processed and persisted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/income-daily/{date}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
    delete:
      tags: [Income Daily]
      summary: Delete income record by date
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Income record deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/actual-expenses:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
    get:
      tags: [Actual Expenses]
      summary: List actual expenses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Actual expenses
    post:
      tags: [Actual Expenses]
      summary: Create actual expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualExpenseRequest'
      responses:
        '201':
          description: Actual expense created
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/actual-expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/EntityID'
    put:
      tags: [Actual Expenses]
      summary: Update actual expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualExpenseRequest'
      responses:
        '200':
          description: Actual expense updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Actual Expenses]
      summary: Delete actual expense
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Actual expense deleted
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/tax-rules:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Tax Rules]
      summary: List tax rules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tax rules
    post:
      tags: [Tax Rules]
      summary: Create tax rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRuleRequest'
      responses:
        '201':
          description: Tax rule created
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/tax-rules/reorder:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    put:
      tags: [Tax Rules]
      summary: Reorder tax rules inside DnD UI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRulesReorderRequest'
      responses:
        '204':
          description: Tax rules reordered
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/tax-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/EntityID'
    put:
      tags: [Tax Rules]
      summary: Update tax rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRuleRequest'
      responses:
        '200':
          description: Tax rule updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tax Rules]
      summary: Delete tax rule
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Tax rule deleted
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/profit-share-rules:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Profit Share Rules]
      summary: List profit share rules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profit share rules
    post:
      tags: [Profit Share Rules]
      summary: Create profit share rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfitShareRuleRequest'
      responses:
        '201':
          description: Profit share rule created
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/profit-share-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/EntityID'
    put:
      tags: [Profit Share Rules]
      summary: Update profit share rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfitShareRuleRequest'
      responses:
        '200':
          description: Profit share rule updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Profit Share Rules]
      summary: Delete profit share rule
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Profit share rule deleted
        '500':
          $ref: '#/components/responses/InternalError'

  /api/projects/{projectId}/payout-preview:
